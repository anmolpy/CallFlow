services:
  postgres:
    image: postgres:16-alpine
    container_name: callflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-callflow}
      POSTGRES_USER: ${POSTGRES_USER:-callflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${DB_PASSWORD:-callflow_dev_password}}
    ports:
      - "${DOCKER_DB_PORT:-5433}:5432"
    volumes:
      - callflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-callflow_user} -d $${POSTGRES_DB:-callflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: callflow-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-callflow}
      DB_USERNAME: ${POSTGRES_USER:-callflow_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-${DB_PASSWORD:-callflow_dev_password}}
      JWT_SECRET: ${JWT_SECRET:-change_me_to_a_secure_random_256_bit_secret_key_for_local_dev}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      CALLFLOW_DEV_SEED_USERS: ${CALLFLOW_DEV_SEED_USERS:-true}
      CALLFLOW_DEV_ADMIN_EMAIL: ${CALLFLOW_DEV_ADMIN_EMAIL:-admin@callflow.local}
      CALLFLOW_DEV_ADMIN_PASSWORD: ${CALLFLOW_DEV_ADMIN_PASSWORD:-change_me_admin_pass}
      CALLFLOW_DEV_AGENT_EMAIL: ${CALLFLOW_DEV_AGENT_EMAIL:-agent@callflow.local}
      CALLFLOW_DEV_AGENT_PASSWORD: ${CALLFLOW_DEV_AGENT_PASSWORD:-change_me_agent_pass}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: callflow-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  callflow_pgdata:
